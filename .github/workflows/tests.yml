name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres
    steps:
      - uses: actions/checkout@v4
      # run_all.sh prints test results and does not set its exit code, so fail on ERROR lines and on lines that start
      # with FAIL (a failed test or migration); the "TOTAL n FAIL 0" summaries must not count.
      - name: Migrations and SQL tests
        run: |
          sh supabase/tests/run_all.sh | tee sql.log
          ! grep -E "^FAIL|ERROR" sql.log

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/pos-mobile/package-lock.json
      - run: npm ci
      - run: npm run test:js

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The backoffice tests run .ts files with node --test, which needs Node's built-in type stripping.
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -w @hermes-pos/backoffice
