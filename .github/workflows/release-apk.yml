# Publishes the cashier APK. Push a tag that matches the version in apps/pos-mobile/app.json (e.g. v1.1.0).
# Needs these repository secrets: HERMES_KEYSTORE_BASE64, HERMES_UPLOAD_STORE_PASSWORD, HERMES_UPLOAD_KEY_ALIAS,
# HERMES_UPLOAD_KEY_PASSWORD, EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY (root README, "Build an APK").
name: release-apk

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos-mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag, app.json and build.gradle agree
        run: |
          v=$(node -p "require('./app.json').expo.version")
          g=$(sed -n 's/.*versionName "\(.*\)"/\1/p' android/app/build.gradle)
          [ "${GITHUB_REF_NAME}" = "v$v" ] && [ "$g" = "$v" ] || { echo "tag ${GITHUB_REF_NAME}, app.json $v, build.gradle $g: they must match"; exit 1; }

      - name: Release key is present
        env:
          KEY: ${{ secrets.HERMES_KEYSTORE_BASE64 }}
        run: '[ -n "$KEY" ] || { echo "HERMES_KEYSTORE_BASE64 is not set: refusing to ship a debug-signed APK"; exit 1; }'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/pos-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:js

      - name: Build and sign
        env:
          KEY: ${{ secrets.HERMES_KEYSTORE_BASE64 }}
        run: |
          echo "$KEY" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cd android && ./gradlew assembleRelease \
            -PHERMES_UPLOAD_STORE_FILE="$RUNNER_TEMP/release.keystore" \
            -PHERMES_UPLOAD_STORE_PASSWORD='${{ secrets.HERMES_UPLOAD_STORE_PASSWORD }}' \
            -PHERMES_UPLOAD_KEY_ALIAS='${{ secrets.HERMES_UPLOAD_KEY_ALIAS }}' \
            -PHERMES_UPLOAD_KEY_PASSWORD='${{ secrets.HERMES_UPLOAD_KEY_PASSWORD }}'
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/hermes-pos.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: gh release create "$GITHUB_REF_NAME" hermes-pos.apk --title "HERMES POS ${GITHUB_REF_NAME#v}" --generate-notes
